# Himalaya email CLI config — RankBuilder container
# Repoints the HARO monitor (default-account himalaya reads) at the Mailcow
# inbox that actually receives HARO + Qwoted queries: info@fortressblinds.co.za.
# (Verified 2026-09-02: info@ has 137 HARO/Qwoted msgs, latest Sep 1 — HARO
#  Morning/Afternoon/Evening editions + Qwoted notifications.)
#
# Default account = info@ -> haro_monitor.py's `himalaya envelope list`
# (no -a flag) reads this one. Copied to /root/.config/himalaya/config.toml by
# the Dockerfile (cron + himalaya run as root).
#
# Password is NOT hardcoded here — it's read from the INFO_MAIL_PASSWORD env var
# at runtime (set in Coolify app env). auth.cmd runs in a shell so it expands
# $INFO_MAIL_PASSWORD. Keeps the secret out of git.

[accounts.info]
email = "info@fortressblinds.co.za"
display-name = "Info - Fortress Blinds (HARO/Qwoted inbox)"
default = true

backend.type = "imap"
backend.host = "mail.fortressblinds.co.za"
backend.port = 993
backend.encryption.type = "tls"
backend.login = "info@fortressblinds.co.za"
backend.auth.type = "password"
backend.auth.cmd = "echo \"$INFO_MAIL_PASSWORD\""

message.send.backend.type = "smtp"
message.send.backend.host = "mail.fortressblinds.co.za"
message.send.backend.port = 587
message.send.backend.encryption.type = "start-tls"
message.send.backend.login = "info@fortressblinds.co.za"
message.send.backend.auth.type = "password"
message.send.backend.auth.cmd = "echo \"$INFO_MAIL_PASSWORD\""
