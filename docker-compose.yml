version: "3.8"

services:
  rankbuilder:
    build: .
    container_name: rankbuilder
    restart: unless-stopped
    environment:
      - RUN_MODE=cron
      - HEALTHCHECK_PORT=8080
    env_file:
      - .env
    volumes:
      - rankbuilder-data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  rankbuilder-data:
    driver: local
